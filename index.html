<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chará Music</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .subtitulo {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 12px;
      background: #292929;
      color: white;
      font-size: 16px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .musica {
      background: #292929;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
    }

    .musica a {
      color: white;
      text-decoration: none;
    }

    .vazio {
      color: #888;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎵 Chará Music</h1>

  <div class="subtitulo">
    Seu organizador musical pessoal
  </div>

  <div class="card">

    <label>🧠 Comando para o Chará</label>

    <textarea id="comando"
      placeholder="Exemplo: Monte uma sequência de 1 hora com samba e pagode, começando animada e terminando tranquila."></textarea>

    <button onclick="interpretarComando()">
      🧠 Interpretar comando
    </button>

  </div>

  <div class="card">

    <label>🎵 Importar lista de músicas</label>

    <textarea id="lista"
      placeholder="Cole aqui suas músicas.

Exemplo:
Jorge Ben Jor - Taj Mahal
Zeca Pagodinho - Deixa a Vida Me Levar
Charlie Brown Jr. - Só os Loucos Sabem"></textarea>

    <button onclick="organizarLista()">
      📋 Organizar lista
    </button>

  </div>

  <div class="card">

    <label>🎧 Minha sequência</label>

    <div id="resultado">
      <div class="vazio">
        Sua sequência aparecerá aqui.
      </div>
    </div>

  </div>

</div>

<script>

function organizarLista() {

  const texto = document.getElementById("lista").value.trim();
  const resultado = document.getElementById("resultado");

  if (!texto) {
    resultado.innerHTML =
      '<div class="vazio">Cole uma lista de músicas primeiro.</div>';
    return;
  }

  const linhas = texto
    .split("\n")
    .map(linha => linha.trim())
    .filter(linha => linha.length > 0);

  resultado.innerHTML = "";

  linhas.forEach((musica, indice) => {

    const item = document.createElement("div");
    item.className = "musica";

    const titulo = document.createElement("strong");
    titulo.textContent = (indice + 1) + ". " + musica;

    const link = document.createElement("a");

    link.href =
      "https://www.youtube.com/results?search_query=" +
      encodeURIComponent(musica);

    link.target = "_blank";

    link.textContent = "🔎 Procurar no YouTube";

    item.appendChild(titulo);
    item.appendChild(document.createElement("br"));
    item.appendChild(link);

    resultado.appendChild(item);
  });
}

function interpretarComando() {

  const comando =
    document.getElementById("comando").value.trim();

  if (!comando) {
    alert("Escreva primeiro o comando para o Chará.");
    return;
  }

  alert(
    "Comando recebido! 🧠\n\n" +
    comando +
    "\n\nA interpretação inteligente será nossa próxima etapa."
  );
}

</script>

</body>
</html>
